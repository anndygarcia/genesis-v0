<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genesis — Admin stats</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a2138'/%3E%3Ctext x='50%25' y='53%25' font-family='Inter, sans-serif' font-size='22' font-weight='800' fill='%2300d4ff' text-anchor='middle' dominant-baseline='middle'%3EG%3C/text%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e15;
      --bg-elev: #11182a;
      --text: #e6edf3;
      --text-muted: #8492a6;
      --accent: #00d4ff;
      --accent-dim: rgba(0,212,255,0.2);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      padding: 32px 24px;
    }
    .container { max-width: 980px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 18px;
      margin-bottom: 32px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: -0.01em;
    }
    h1 span { color: var(--accent); }
    .note {
      color: var(--text-muted);
      font-size: 14px;
    }
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 14px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: var(--bg-elev);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 18px 20px;
    }
    .stat-card .label {
      color: var(--text-muted);
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .stat-card .value {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-top: 4px;
      display: block;
    }
    .panel {
      background: var(--bg-elev);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 22px;
      margin-bottom: 24px;
    }
    .panel h2 {
      margin: 0 0 18px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      text-align: left;
      padding: 10px 12px;
      font-size: 13.5px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    th { color: var(--text-muted); font-weight: 500; font-size: 11.5px; letter-spacing: 0.04em; text-transform: uppercase; }
    tr:last-child td { border-bottom: none; }
    .empty {
      color: var(--text-muted);
      text-align: center;
      padding: 32px;
      font-size: 14px;
    }
    .manual {
      margin-top: 24px;
      background: rgba(8,12,22,0.6);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 18px 22px;
    }
    .manual h3 { margin: 0 0 6px; }
    .manual p { font-size: 13.5px; color: var(--text-muted); margin: 0 0 14px; }
    .manual textarea {
      width: 100%;
      min-height: 88px;
      background: rgba(0,0,0,0.3);
      color: #e6edf3;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      padding: 10px;
      font: 13px ui-monospace, monospace;
      resize: vertical;
    }
    .manual button {
      margin: 10px 0 0;
      padding: 8px 16px;
      background: var(--accent);
      color: #001018;
      border: 0;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .manual button:hover { background: #19e7ff; }
    .manual #manual-table { margin-top: 16px; }
    .empty code {
      background: rgba(255,255,255,0.04);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 13px;
    }
    .meta {
      font-size: 12px;
      color: var(--text-muted);
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      background: var(--accent-dim);
      color: var(--accent);
      margin-left: 8px;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .err {
      color: #fca5a5;
      font-size: 13px;
      background: rgba(255,80,80,0.06);
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid rgba(255,80,80,0.25);
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1><span>Genesis</span> — admin stats</h1>
    <a href="/">← back to site</a>
  </header>

  <div id="root">Loading…</div>
</div>

<script>
  // Credentials get asked for by the browser via Basic Auth.
  // On success, we get the JSON; on fail, server sends 401.
  fetch('/api/stats', { credentials: 'include' })
    .then(r => {
      if (r.status === 401) {
        // Browser has already shown a prompt; this is the second attempt
        // after user enters creds. If still 401, show this:
        document.getElementById('root').innerHTML =
          '<div class="panel"><p>Authentication failed.</p></div>';
        return null;
      }
      if (!r.ok) return r.json().then(d => { throw new Error(d.error || r.statusText); });
      return r.json();
    })
    .then(data => {
      if (!data) return;
      const root = document.getElementById('root');
      if (!data.ok) {
        root.innerHTML = `<div class="panel"><p>Error: ${data.error || 'unknown'}</p></div>`;
        return;
      }

      const emails = data.emails || [];
      const note = data.note ? `<p class="note">${data.note}</p>` : '';

      // The endpoint serves a "no KV" message when KV isn't bound. In that
      // case we ALSO surface a manual-entry form so the admin can paste
      // signups from their inbox into this dashboard.
      const noKV = !!data.note;
      const manual = noKV ? `
        <div class="manual">
          <h3>Quick add signups from your inbox</h3>
          <p>If you got the admin notification email, copy-paste each
             <code>email:&nbsp;…</code> line from the Resend email body below.
             Stored locally in your browser only — never sent anywhere.</p>
          <textarea id="manual-input" placeholder="user@example.com, US, 2026-07-16T18:24:11Z
other@example.com, MX, 2026-07-16T18:30:00Z"></textarea>
          <button id="manual-save">Save locally</button>
          <table id="manual-table"></table>
        </div>
      ` : '';

      root.innerHTML = `
        <div class="stats-row">
          <div class="stat-card"><span class="label">Emails</span><span class="value">${emails.length}</span></div>
          <div class="stat-card"><span class="label">Visits (uniq IP/day)</span><span class="value">${data.visitCount || 0}</span></div>
          <div class="stat-card"><span class="label">Last signup</span><span class="value" style="font-size:14px;line-height:1.4;">${emails.length ? new Date(emails[emails.length-1].ts).toLocaleString() : '—'}</span></div>
        </div>

        <div class="panel">
          <h2>Waitlist signups</h2>
          ${note}
          ${emails.length === 0 ? `
            <div class="empty">
              No signups captured yet. As soon as a real signup comes in (and KV is bound),
              it will appear here.
            </div>
          ` : `
            <table>
              <thead>
                <tr>
                  <th>Email</th>
                  <th>Country</th>
                  <th>Time</th>
                  <th>User agent</th>
                </tr>
              </thead>
              <tbody>
                ${emails.slice().reverse().map(e => `
                  <tr>
                    <td>${escapeHTML(e.email)}</td>
                    <td class="meta">${escapeHTML(e.country || '?')}</td>
                    <td class="meta">${new Date(e.ts).toLocaleString()}</td>
                    <td class="meta">${escapeHTML((e.ua || '').slice(0, 60))}${(e.ua || '').length > 60 ? '…' : ''}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `}
        </div>
        ${manual}
      `;

      if (noKV) wireManual();
    })
    .catch(err => {
      document.getElementById('root').innerHTML =
        `<div class="panel err">Failed to load stats: ${escapeHTML(err.message)}</div>`;
    });

  function wireManual() {
    const input = document.getElementById('manual-input');
    const btn   = document.getElementById('manual-save');
    const table = document.getElementById('manual-table');

    function load() {
      try { return JSON.parse(localStorage.getItem('genesis_manual_signups') || '[]'); }
      catch { return []; }
    }
    function save(rows) {
      localStorage.setItem('genesis_manual_signups', JSON.stringify(rows));
    }
    function render(rows) {
      if (!rows.length) { table.innerHTML = ''; return; }
      table.innerHTML = `<thead><tr><th>Email</th><th>Country</th><th>Time</th></tr></thead><tbody>${
        rows.slice().reverse().map(r => `<tr><td>${escapeHTML(r.email)}</td><td class="meta">${escapeHTML(r.country||'')}</td><td class="meta">${escapeHTML(r.ts)}</td></tr>`).join('')
      }</tbody>`;
    }
    btn.addEventListener('click', () => {
      const lines = input.value.split('\n').map(s => s.trim()).filter(Boolean);
      const rows = load();
      for (const line of lines) {
        const parts = line.split(',').map(s => s.trim());
        if (!parts[0]) continue;
        rows.push({ email: parts[0], country: parts[1] || '', ts: parts[2] || new Date().toISOString() });
      }
      save(rows);
      input.value = '';
      render(rows);
    });
    render(load());
  }

  function escapeHTML(s) {
    return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }
</script>
</body>
</html>
